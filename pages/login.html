<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookSetu</title>
    <style>html,body{opacity:1!important;background-color:#fafaf8!important;background-image:none!important;}</style>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container">
        <!-- Back Button -->
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>

        <!-- Login & Info Layout -->
        <div class="login-wrapper">
            <!-- Main Login Card -->
            <div class="login-card">
                <div class="login-header">
                    <h1>BookSetu</h1>
                    <p>Welcome Back</p>
                </div>

                <!-- Login Form -->
                <form class="login-form" id="loginForm">
                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="your@email.com" 
                                required
                            >
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <i class="fas fa-eye"></i>
                            </button>
                            <span class="focus-border"></span>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-footer">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <!-- Login Button -->
                    <button type="submit" class="btn btn-login">
                        <span>Login to Account</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="signup-link">
                    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
                </div>

                <!-- Social Divider -->
                <div class="social-divider">
                    <span>or continue with</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-buttons">
                    <button type="button" class="social-btn" title="Facebook" aria-label="Login with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </button>
                    <button type="button" class="social-btn" title="Google" aria-label="Login with Google">
                        <i class="fab fa-google"></i>
                    </button>
                    <button type="button" class="social-btn" title="Twitter" aria-label="Login with Twitter">
                        <i class="fab fa-twitter"></i>
                    </button>
                    <button type="button" class="social-btn" title="Apple" aria-label="Login with Apple">
                        <i class="fab fa-apple"></i>
                    </button>
                </div>
            </div>

            <!-- Information Cards -->
            <div class="login-info">
                <div class="info-box">
                    <i class="fas fa-book"></i>
                    <h3>Explore</h3>
                    <p>Discover thousands of books in our digital library</p>
                </div>
                <div class="info-box">
                    <i class="fas fa-users"></i>
                    <h3>Connect</h3>
                    <p>Join our vibrant reading community</p>
                </div>
                <div class="info-box">
                    <i class="fas fa-star"></i>
                    <h3>Track</h3>
                    <p>Keep track of your reading progress and favorites</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/public/api-service.js"></script>
    <script src="/public/script.js"></script>
</body>
</html>
